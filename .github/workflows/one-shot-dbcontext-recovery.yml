name: One-shot DbContext recovery

on:
  push:
    branches:
      - feature/cave-revisions
    paths:
      - .github/workflows/one-shot-dbcontext-recovery.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cave-revisions
          fetch-depth: 0
      - name: Restore reviewed DbContext and make only the partial declaration change
        shell: bash
        run: |
          git checkout b0b22362f5738ff778bb6358d3fb7bb68d75c16d -- Planarian/Planarian.Model/Database/PlanarianDbContext.cs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Planarian/Planarian.Model/Database/PlanarianDbContext.cs')
          text = path.read_text()
          if 'partial class PlanarianDbContext' not in text:
              old = 'class PlanarianDbContext'
              if old not in text:
                  raise SystemExit('PlanarianDbContext declaration not found')
              text = text.replace(old, 'partial class PlanarianDbContext', 1)
              path.write_text(text)
          forbidden = ('__ACCIDENTAL', '__BAD', '__PROBE', '__WRONG', '__PLACEHOLDER', '__STOP', '__DO_NOT_KEEP', '__NO', '__TEST', '__NEEDS_PATCH')
          if any(token in text for token in forbidden):
              raise SystemExit('placeholder token survived reviewed-head restoration')
          PY
          rm -f .github/workflows/one-shot-dbcontext-partial.yml
          rm .github/workflows/one-shot-dbcontext-recovery.yml
      - name: Commit exact recovery
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Planarian/Planarian.Model/Database/PlanarianDbContext.cs .github/workflows/one-shot-dbcontext-recovery.yml
          git add -u .github/workflows/one-shot-dbcontext-partial.yml || true
          git commit -m 'Restore DbContext and enable revision tenant filters'
          git push origin HEAD:feature/cave-revisions
