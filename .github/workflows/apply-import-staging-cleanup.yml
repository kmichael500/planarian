name: Apply import staging cleanup

on:
  push:
    branches:
      - feature/cave-revisions
    paths:
      - .github/workflows/apply-import-staging-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cave-revisions
          fetch-depth: 0
      - name: Remove obsolete import staging architecture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service = Path('Planarian/Planarian/Modules/Account/Import/Services/ImportService.cs')
          text = service.read_text()
          for old in [
              'using Planarian.Modules.Import.Repositories;\n',
              '    private readonly EntranceImportPlanStore _entranceImportPlanStore;\n',
              '        EntranceImportPlanStore entranceImportPlanStore,\n',
              '        _entranceImportPlanStore = entranceImportPlanStore;\n',
          ]:
              if old not in text:
                  raise SystemExit(f'expected ImportService fragment missing: {old!r}')
              text = text.replace(old, '')
          service.write_text(text)

          program = Path('Planarian/Planarian/Startup/Program.cs')
          text = program.read_text()
          for old in [
              'using Planarian.Modules.Import.Repositories;\n',
              'builder.Services.AddScoped<EntranceImportPlanStore>();\n',
          ]:
              if old not in text:
                  raise SystemExit(f'expected Program fragment missing: {old!r}')
              text = text.replace(old, '')
          program.write_text(text)
          PY

          rm -f Planarian/Planarian/Modules/Import/Repositories/TemporaryEntranceRepository.cs
          rm -f Planarian/Planarian.Model/Database/TemporaryEntities/TemporaryEntrance.cs
          rm -f Planarian/Planarian/Modules/Import/Models/TemporaryEntranceResult.cs
          rm .github/workflows/apply-import-staging-cleanup.yml

          if grep -R -n -E 'TemporaryEntrance|EntranceImportPlanStore' Planarian/Planarian Planarian/Planarian.Model --include='*.cs'; then
            echo 'obsolete import staging reference remains' >&2
            exit 1
          fi

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove obsolete entrance import staging'
          git push origin HEAD:feature/cave-revisions
