name: Fix manager Cave delete staged files

on:
  push:
    branches: [feature/cave-revisions]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cave-revisions
          fetch-depth: 0
      - run: python .github/scripts/fix_manager_cave_delete_staged_files.py
      - name: Commit fix and remove helper files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zz-fix-manager-cave-delete-staged-files.yml .github/scripts/fix_manager_cave_delete_staged_files.py
          git add Planarian/Planarian/Modules/Caves/Repositories/CaveRepository.cs Planarian/Planarian/Modules/Caves/Services/CaveService.cs
          git commit -m "fix: clear staged file references before cave delete"
          git push origin HEAD:feature/cave-revisions
