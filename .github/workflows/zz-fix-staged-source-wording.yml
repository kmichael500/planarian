name: Fix staged source wording

on:
  push:
    branches: [feature/cave-revisions]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cave-revisions
          fetch-depth: 0
      - run: python .github/scripts/fix_staged_source_wording.py
      - name: Commit correction and remove helper files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zz-fix-staged-source-wording.yml .github/scripts/fix_staged_source_wording.py
          git add Planarian/Planarian/Modules/Files/Services/FileService.cs
          git commit -m "docs: clarify staged blob ownership"
          git push origin HEAD:feature/cave-revisions
