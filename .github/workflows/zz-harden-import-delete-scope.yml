name: Harden import deletion scope

on:
  push:
    branches: [feature/cave-revisions]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cave-revisions
          fetch-depth: 0
      - run: python .github/scripts/harden_import_delete_scope.py
      - name: Commit hardening and remove helper files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zz-harden-import-delete-scope.yml .github/scripts/harden_import_delete_scope.py
          git add Planarian/Planarian/Modules/Import/Planning/CaveImportExecutor.cs Planarian/Planarian/Modules/Import/Planning/EntranceImportExecutor.cs
          git commit -m "fix: qualify destructive import queries by tenant"
          git push origin HEAD:feature/cave-revisions
