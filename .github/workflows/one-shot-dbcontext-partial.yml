name: One-shot DbContext partial patch

on:
  push:
    branches:
      - feature/cave-revisions
    paths:
      - .github/workflows/one-shot-dbcontext-partial.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cave-revisions
          fetch-depth: 0
      - name: Make PlanarianDbContext partial without replacing the file
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Planarian/Planarian.Model/Database/PlanarianDbContext.cs')
          text = path.read_text()
          if 'partial class PlanarianDbContext' not in text:
              old = 'class PlanarianDbContext'
              if old not in text:
                  raise SystemExit('PlanarianDbContext declaration was not found; refusing broad edit')
              text = text.replace(old, 'partial class PlanarianDbContext', 1)
              path.write_text(text)
          PY
          rm .github/workflows/one-shot-dbcontext-partial.yml
      - name: Commit the exact patch and remove this workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Planarian/Planarian.Model/Database/PlanarianDbContext.cs .github/workflows/one-shot-dbcontext-partial.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Make PlanarianDbContext partial for tenant filters'
          git push origin HEAD:feature/cave-revisions
