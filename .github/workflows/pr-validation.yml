name: PR validation

on:
  pull_request:
    paths:
      - "Planarian.Web/**"
      - "Planarian/**"
      - "Planarian.Tests/**"
      - "Planarian.Tests.Unit/**"
      - "Planarian.Tests.Integration/**"
      - "Contracts/**"
      - "docs/**"
      - "AGENTS.md"
      - "scripts/**"
      - ".github/workflows/pr-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Planarian.Web/package-lock.json
      - run: npm ci
        working-directory: Planarian.Web
      - run: npm run check:client-routes
        working-directory: Planarian.Web
      - run: scripts/validate-env-example.sh
      - run: npm test -- --watchAll=false --runInBand
        working-directory: Planarian.Web
      - run: npm run build
        working-directory: Planarian.Web
        env:
          REACT_APP_API_ORIGIN_MAPPINGS: '{"localhost":"https://localhost:7111"}'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet tool restore
      - run: dotnet restore Planarian/Planarian.sln
      - run: dotnet build Planarian/Planarian.sln --configuration Release --no-restore
      - name: Verify EF migrations match the model
        run: >-
          dotnet tool run dotnet-ef migrations has-pending-model-changes
          --project Planarian/Planarian.Migrations/Planarian.Migrations.csproj
          --startup-project Planarian/Planarian.Migrations/Planarian.Migrations.csproj
          --context PlanarianDbContext
          --configuration Release
          --no-build
      - name: Run unit and architecture tests
        run: >-
          dotnet test Planarian.Tests.Unit/Planarian.Tests.Unit.csproj
          --configuration Release --no-restore
          --logger "trx;LogFileName=unit-results.trx"
          --results-directory Planarian.Tests.Unit/TestResults
      - name: Run PostgreSQL/PostGIS integration tests (including migrations, golden, and supported scale)
        id: dotnet_tests
        continue-on-error: true
        run: >-
          dotnet test Planarian.Tests.Integration/Planarian.Tests.Integration.csproj
          --configuration Release
          --no-restore
          --logger "trx;LogFileName=test-results.trx"
          --results-directory Planarian.Tests.Integration/TestResults
      - name: Surface .NET test failures
        if: always()
        shell: python
        run: |
          import os
          import sys
          import xml.etree.ElementTree as ET

          path = "Planarian.Tests.Integration/TestResults/test-results.trx"
          test_step_failed = "${{ steps.dotnet_tests.outcome }}" == "failure"

          def escape(value: str) -> str:
              return (
                  value.replace("%", "%25")
                  .replace("\r", "%0D")
                  .replace("\n", "%0A")
              )

          if not os.path.exists(path):
              if test_step_failed:
                  print("::error title=.NET tests failed::dotnet test failed before a TRX result file was produced")
                  sys.exit(1)
              sys.exit(0)

          root = ET.parse(path).getroot()
          namespace = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          failures = root.findall(".//t:UnitTestResult[@outcome='Failed']", namespace)

          for result in failures:
              name = result.attrib.get("testName", "Unknown test")
              message = result.findtext("t:Output/t:ErrorInfo/t:Message", default="", namespaces=namespace)
              stack = result.findtext("t:Output/t:ErrorInfo/t:StackTrace", default="", namespaces=namespace)
              details = message.strip()
              if stack.strip():
                  details = f"{details}\n{stack.strip()}" if details else stack.strip()
              print(f"::error title={escape(name)}::{escape(details or 'Test failed')}")

          if failures or test_step_failed:
              sys.exit(1)
