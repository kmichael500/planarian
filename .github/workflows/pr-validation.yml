name: PR validation

on:
  pull_request:
    paths:
      - "Planarian.Web/**"
      - "Planarian/**"
      - "Planarian.Tests/**"
      - "scripts/**"
      - ".github/workflows/pr-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Planarian.Web/package-lock.json
      - run: npm ci
        working-directory: Planarian.Web
      - run: scripts/validate-env-example.sh
      - run: npm test -- --watchAll=false --runInBand
        working-directory: Planarian.Web
      - run: npm run build
        working-directory: Planarian.Web
        env:
          REACT_APP_API_ORIGIN_MAPPINGS: '{"localhost":"https://localhost:7111"}'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Planarian/Planarian/Planarian.sln
      - run: dotnet build Planarian/Planarian/Planarian.sln --configuration Release --no-restore
      - run: dotnet test Planarian.Tests/Planarian.Tests.csproj --configuration Release --no-restore
