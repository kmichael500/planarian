name: Wire Cave revision publication

on:
  push:
    branches: [feature/cave-revisions]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cave-revisions
          fetch-depth: 0
      - run: python .github/scripts/wire_cave_revisions.py
      - name: Commit wiring and remove helper files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zz-wire-cave-revisions.yml .github/scripts/wire_cave_revisions.py
          git add Planarian/Planarian/Modules/Caves/Services/CaveService.cs Planarian/Planarian/Modules/Files/Services/FileService.cs
          git commit -m "feat: publish revisions for manager cave mutations"
          git push origin HEAD:feature/cave-revisions
