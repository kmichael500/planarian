name: Fix remaining import failures

on:
  push:
    branches: [feature/cave-revisions]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cave-revisions
          fetch-depth: 0
      - run: python .github/scripts/fix_remaining_import_failures.py
      - name: Commit fixes and remove helper files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zz-fix-remaining-import-failures.yml .github/scripts/fix_remaining_import_failures.py
          git add Planarian/Planarian/Modules/Import/Planning/EntranceImportPlanner.cs Planarian.Tests/CaveImportCompatibilityTests.cs Planarian.Tests/ImportScaleBenchmarkTests.cs Planarian.Tests/ReferenceRenameNoFanOutIntegrationTests.cs
          git commit -m "fix: resolve remaining import integration failures"
          git push origin HEAD:feature/cave-revisions
