name: Fix file blob compensation

on:
  push:
    branches: [feature/cave-revisions]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cave-revisions
          fetch-depth: 0
      - run: python .github/scripts/fix_file_blob_compensation.py
      - name: Commit fix and remove helper files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zz-fix-file-blob-compensation.yml .github/scripts/fix_file_blob_compensation.py
          git add Planarian/Planarian/Modules/Files/Services/FileService.cs
          git commit -m "fix: compensate file blobs when database publication fails"
          git push origin HEAD:feature/cave-revisions
